name: Publish SH Notes

on:
  push:
    branches: [main]
    paths:
      - 'MathLog/**'
      - 'DM/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site/requirements.txt
      - name: Install PDF tools
        run: python -m pip install -r site/requirements.txt
      - name: Build catalog, covers and reader
        run: |
          node --test site/test_reader_touch.mjs
          node --test site/test_reading_state.mjs
          python site/test_build.py
          python site/build.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install browser checks
        working-directory: site
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium webkit
      - name: Check Chromium reader
        run: node --test site/test_browser.cjs
      - name: Check WebKit reader
        env:
          BROWSER: webkit
        run: node --test site/test_browser.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
